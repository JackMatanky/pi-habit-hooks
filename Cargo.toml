[workspace]
resolver = "2"
members = [
  "crates/habit-cli",
  "crates/habit-core",
  "crates/habit-judge",
  "crates/habit-mapper",
  "crates/habit-sensors",
  "crates/habit-snooze",
  "plugins/rust/sensors",
]

[workspace.package]
version = "1.5.0"
authors = ["Habit Hooks Authors"]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
glob = "0.3.4"
minijinja = { version = "3.0.3", features = ["serde"] }
pathdiff = "0.2.3"
pretty_assertions = "1.4.1"
rayon = "1.10"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
walkdir = "2.5.0"
