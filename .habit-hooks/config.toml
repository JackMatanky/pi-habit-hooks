# Project overrides for Habit Hooks on this repository.
plugins = ["rust", "generic"]

# Build output and lockfiles are not hand-written source: never scan them for duplication or size.
[sensors.jscpd]
files = ["**/*", "!dist/**", "!**/Cargo.lock", "!**/target/**", "!**/node_modules/**", "!**/.habit-hooks/**"]

[sensors.line-count]
files = ["**/*", "!dist/**", "!**/Cargo.lock", "!**/target/**", "!**/node_modules/**", "!**/.habit-hooks/**"]

# Reported as coaching, not as a stop-gate refusal.
# - DevelopmentCodeFragment / ExitExpression: this is a CLI, printing and exiting are its job.
# - duplicate-dependency: fires on the workspace's own crates, which are not duplicate versions.
# - high-complexity / duplicated-code / oversized-file: pre-existing in habit_hooks.rs and test_install.rs;
#   tracked as refactors rather than blocking every session.
[smells.DevelopmentCodeFragment]
severity = "suggested"

[smells.ExitExpression]
severity = "suggested"

[smells.duplicate-dependency]
severity = "suggested"

[smells.high-complexity]
severity = "suggested"

[smells.duplicated-code]
severity = "suggested"

[smells.oversized-file]
severity = "suggested"

[smells."clippy::needless_borrows_for_generic_args"]
severity = "suggested"
