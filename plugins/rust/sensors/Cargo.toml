[package]
name = "habit-rust-sensors"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

# Binary names keep the `_sensor` suffix: cargo forbids a bin named `deps` (it
# collides with target/<profile>/deps). The wrapper scripts next to src/
# (clippy, comment, modules, deps) exec these binaries.
[[bin]]
name = "clippy_sensor"
path = "src/clippy.rs"

[[bin]]
name = "comment_sensor"
path = "src/comment.rs"

[[bin]]
name = "modules_sensor"
path = "src/modules.rs"

[[bin]]
name = "deps_sensor"
path = "src/deps.rs"

[dependencies]
clap.workspace = true
pathdiff.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
